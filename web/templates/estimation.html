<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Estimate · Berkane Immo</title><link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}"></head>
<body><nav class="navbar"><div class="logo">Berkane Immo ML</div><div class="nav-links"><a href="{{ url_for('pages', page='accueil') }}">Home</a><a href="{{ url_for('pages', page='estimation') }}">Estimate</a></div></nav><main class="card"><h1>Property price estimate</h1><p id="model-status">The API model status is checked when you submit.</p><form id="estimate-form"><label>District <input name="district" value="Centre-ville" required></label><label>Property type <select name="property_type"><option>apartment</option><option>house</option><option>villa</option></select></label><label>Condition <select name="condition"><option>good</option><option>renovated</option><option>new</option><option>to_renovate</option></select></label><label>Area (m²) <input name="area_m2" type="number" value="95" required></label><label>Bedrooms <input name="bedrooms" type="number" value="3" required></label><label>Bathrooms <input name="bathrooms" type="number" value="2" required></label><label>Floor <input name="floor" type="number" value="2" required></label><label>Age (years) <input name="age_years" type="number" value="8" required></label><label><input name="balcony" type="checkbox"> Balcony</label><label><input name="garden" type="checkbox"> Garden</label><label><input name="garage" type="checkbox"> Garage</label><label><input name="air_conditioning" type="checkbox"> Air conditioning</label><button class="button" type="submit">Estimate</button></form><div id="result" role="status"></div></main><script src="{{ url_for('static', filename='js/estimation.js') }}"></script></body></html>
